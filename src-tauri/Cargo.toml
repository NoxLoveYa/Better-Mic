[package]
name = "better-mic"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
rtrb = "0.4"
nnnoiseless = "0.5"
libloading = "0.9"

[profile.dev]
opt-level = 2
